<svg width="640" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060b1f"/>
      <stop offset="50%" stop-color="#0e1444"/>
      <stop offset="100%" stop-color="#1a1f5a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9952e"/>
      <stop offset="50%" stop-color="#f5d063"/>
      <stop offset="100%" stop-color="#c9952e"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7dc6f"/>
      <stop offset="100%" stop-color="#c9952e"/>
    </linearGradient>
    <radialGradient id="moonAura" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#f5d063" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#f5d063" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f5d063" stop-opacity="0"/>
    </radialGradient>
    <pattern id="geom" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M16,0 L32,16 L16,32 L0,16 Z" fill="none" stroke="#c9952e" stroke-width="0.4" opacity="0.12"/>
    </pattern>
    <clipPath id="crescentClip">
      <path d="M 0,0 L 640,0 L 640,640 L 0,640 Z M 338,212 a 55,55 0 1,1 0,-0.01 Z" clip-rule="evenodd"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#geom)"/>

  <!-- Moon glow -->
  <circle cx="315" cy="200" r="160" fill="url(#moonAura)"/>

  <!-- Crescent -->
  <circle cx="320" cy="200" r="65" fill="url(#moonGrad)" clip-path="url(#crescentClip)"/>

  <!-- Star -->
  <g transform="translate(398, 165)">
    <polygon points="0,-10 2.5,-3 10,-3 4,2 6,10 0,5 -6,10 -4,2 -10,-3 -2.5,-3" fill="#f5d063" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="320" y="370" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="url(#gold)" letter-spacing="-1">
    Ramazon
  </text>
  <text x="320" y="430" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="url(#gold)" letter-spacing="-1">
    Rejam
  </text>

  <!-- Subtitle -->
  <text x="320" y="475" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a0aac8" letter-spacing="3">
    NAMOZ · ZIKR · ODATLAR
  </text>

  <!-- Mosque silhouette -->
  <g transform="translate(0, 640)" fill="#0a0f30">
    <rect x="0" y="-50" width="640" height="55"/>
    <ellipse cx="200" cy="-55" rx="35" ry="25"/>
    <ellipse cx="320" cy="-58" rx="60" ry="42"/>
    <rect x="317" y="-105" width="6" height="14"/>
    <circle cx="320" cy="-107" r="5"/>
    <ellipse cx="440" cy="-55" rx="35" ry="25"/>
    <rect x="120" y="-95" width="6" height="48" rx="1"/>
    <circle cx="123" cy="-97" r="3"/>
    <rect x="514" y="-95" width="6" height="48" rx="1"/>
    <circle cx="517" cy="-97" r="3"/>
  </g>
</svg>
