<svg width="640" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2f2b"/>
      <stop offset="45%" stop-color="#092420"/>
      <stop offset="100%" stop-color="#051614"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b08518"/>
      <stop offset="50%" stop-color="#dbb84a"/>
      <stop offset="100%" stop-color="#b08518"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f2e4a8"/>
      <stop offset="45%" stop-color="#dbb84a"/>
      <stop offset="100%" stop-color="#b08518"/>
    </linearGradient>
    <radialGradient id="moonAura" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#dbb84a" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#dbb84a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#dbb84a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="geom" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M16,0 L32,16 L16,32 L0,16 Z" fill="none" stroke="#b08518" stroke-width="0.4" opacity="0.12"/>
    </pattern>
    <clipPath id="crescentClip">
      <path d="M 0,0 L 640,0 L 640,640 L 0,640 Z M 348,163 a 51,51 0 1,1 0,-0.01 Z" clip-rule="evenodd"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#geom)"/>

  <!-- Moon glow -->
  <circle cx="315" cy="200" r="160" fill="url(#moonAura)"/>

  <!-- Crescent -->
  <circle cx="320" cy="200" r="65" fill="url(#moonGrad)" clip-path="url(#crescentClip)"/>

  <!-- Scattered stars -->
  <circle cx="398" cy="160" r="2.2" fill="#dbb84a" opacity="0.45"/>
  <circle cx="380" cy="138" r="1.5" fill="#c9a63e" opacity="0.30"/>
  <circle cx="420" cy="195" r="1.3" fill="#c9a63e" opacity="0.25"/>
  <circle cx="255" cy="145" r="1.8" fill="#dbb84a" opacity="0.38"/>
  <circle cx="440" cy="140" r="1" fill="#b8962e" opacity="0.18"/>
  <circle cx="270" cy="250" r="1.4" fill="#c9a63e" opacity="0.22"/>
  <circle cx="410" cy="240" r="1.2" fill="#b8962e" opacity="0.18"/>
  <circle cx="185" cy="180" r="1.6" fill="#dbb84a" opacity="0.32"/>
  <circle cx="450" cy="110" r="0.9" fill="#a68525" opacity="0.12"/>
  <circle cx="230" cy="120" r="1" fill="#b8962e" opacity="0.15"/>
  <circle cx="160" cy="130" r="0.8" fill="#a68525" opacity="0.10"/>
  <circle cx="470" cy="175" r="0.7" fill="#a68525" opacity="0.09"/>
  <circle cx="130" cy="220" r="1.3" fill="#c9a63e" opacity="0.22"/>
  <circle cx="490" cy="230" r="1" fill="#b8962e" opacity="0.15"/>
  <circle cx="110" cy="95" r="1.5" fill="#dbb84a" opacity="0.35"/>
  <circle cx="500" cy="85" r="1.2" fill="#c9a63e" opacity="0.25"/>
  <circle cx="80" cy="290" r="0.9" fill="#a68525" opacity="0.10"/>
  <circle cx="530" cy="150" r="0.8" fill="#a68525" opacity="0.08"/>

  <!-- Title -->
  <text x="320" y="370" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="url(#gold)" letter-spacing="-1">
    Ramazon
  </text>
  <text x="320" y="430" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="url(#gold)" letter-spacing="-1">
    Rejam
  </text>

  <!-- Subtitle -->
  <text x="320" y="475" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8fa89a" letter-spacing="3">
    NAMOZ · ZIKR · ODATLAR
  </text>

  <!-- Mosque silhouette -->
  <g transform="translate(0, 640)" fill="#031210">
    <rect x="0" y="-50" width="640" height="55"/>
    <ellipse cx="200" cy="-55" rx="35" ry="25"/>
    <ellipse cx="320" cy="-58" rx="60" ry="42"/>
    <rect x="317" y="-105" width="6" height="14"/>
    <circle cx="320" cy="-107" r="5"/>
    <ellipse cx="440" cy="-55" rx="35" ry="25"/>
    <rect x="120" y="-95" width="6" height="48" rx="1"/>
    <circle cx="123" cy="-97" r="3"/>
    <rect x="514" y="-95" width="6" height="48" rx="1"/>
    <circle cx="517" cy="-97" r="3"/>
  </g>
</svg>
